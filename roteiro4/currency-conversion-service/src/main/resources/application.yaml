spring:
  application:
    name: currency-conversion-service
server:
  port: 8100
management:
  server:
    port: 9100
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health,metrics"
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
